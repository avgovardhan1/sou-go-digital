["Five things every business website needs","Websites","4 min read","A good business website is simple. These five basics decide whether visitors trust you and get in touch.",["Start with a clear headline that says what you do and who it is for. Visitors decide in a few seconds whether they are in the right place, so avoid vague slogans.","Make contact effortless. Put a phone number, a WhatsApp link or a short form on every page, and make sure the button stands out on mobile.","Show proof. Real photos, client names, results and reviews build trust faster than any claim you can write about yourself.","Load quickly. Compress images, remove heavy scripts and test on a normal mobile connection, because slow pages lose visitors before they read a word.","Finally, keep the content current. Outdated prices, broken links or an old copyright year make a business look inactive."]],
["SEO basics for local businesses","Marketing","5 min read","Most local customers start with a search. These steps help the right people find you first.",["Begin with the words customers actually use. Write down the questions they ask, such as the service plus your city, and make sure each one has a clear page on your site.","Claim and complete your Google Business Profile with accurate hours, services, photos and your website address. It often matters as much as your own site for local searches.","Add useful content. A page that answers a real question in plain language gives search engines and visitors a reason to stay.","Ask happy customers for reviews and reply to every one. Consistent, genuine reviews support both trust and local visibility.","Track what happens. Use Google Search Console to see which searches bring visitors, then improve the pages that are close to ranking well."]],
["Google Ads or Meta Ads: where to spend first","Advertising","4 min read","Both platforms can bring customers, but they work differently. Here is how to choose where to begin.",["Google Ads reaches people who are already searching for what you sell. It suits services people look for when they need them, such as repairs, clinics or admissions.","Meta Ads, on Facebook and Instagram, reaches people while they browse. It suits products and offers that people may not be searching for yet, and it works well with strong images and video.","If your budget is small, start with the platform closest to buying intent. For many service businesses that is Google Ads. For visual products it is often Meta.","Whichever you choose, send visitors to a focused page with one clear action, and track enquiries so you can see the real cost of each lead."]],
["Why fast replies win more leads","Automation","3 min read","The business that answers first often wins the customer. Simple automation can make sure that is you.",["People send enquiries to several businesses at once. The first helpful reply usually gets the conversation, even when the price is not the lowest.","An instant confirmation by email or WhatsApp tells the visitor you have received their request and what happens next. It takes minutes to set up.","Follow-up matters too. A short reminder a day or two later recovers many leads that would otherwise go quiet.","Automation should feel personal, not robotic. Use the person's name, mention what they asked about and make it easy to reply to a real human."]],
["Is your Google Business Profile working for you?","Marketing","3 min read","Your profile is often the first thing a local customer sees. A quick check can fix common gaps.",["Check that your name, address and phone number match your website exactly. Differences confuse both customers and search engines.","Choose the most accurate main category and add every service you offer. Add real photos of your premises, team and work.","Post updates and offers regularly, and answer the questions customers ask. An active profile signals that you are open for business.","Finally, respond to every review, including the critical ones, in a calm and helpful tone."]],
["WordPress or custom code: which is right for you?","Websites","4 min read","Both are good choices. The right one depends on how you will use and change your website.",["WordPress suits businesses that want to edit pages, add blog posts or manage products themselves. There are thousands of themes and plugins, and many people can support it.","Custom code suits projects that need unusual features, very high speed or a design that does not fit a template. It gives more control but usually needs a developer for changes.","Think about who will update the site and how often. If you will change content weekly, an easy editor saves time and money.","If you are unsure, tell us what you want the website to do and we will suggest the simplest option that meets it."]]];

[/team|who are you|who is behind|about (you|us)|company/i,()=>"SouGo Digital is a small studio for websites and marketing. Read <a href=\"#about\">About us</a> or <a href=\"#team\">meet the team</a>."],
[/audit|review my (site|website)|check my (site|website)/i,()=>"Yes, we offer a free website audit. Fill in the short form on our <a href=\"#home\">Home page</a> and we will review your site and email you suggestions."],
[/pric|cost|charge|how much|plan|package|quote|budget/i,()=>"Our website plans start at "+inr(PL.web[0][1])+" and monthly growth plans at "+inr(PL.grow[0][1])+". Try the <a href=\"#pricing\">instant quote calculator</a> for an estimate, or send your requirements through the "+links()+" for a fixed quote."],
[/how long|timeline|duration|weeks|days|deliver|time/i,()=>"Most business websites launch in two to four weeks. Stores usually take three to six weeks. Marketing campaigns can often go live within one to two weeks."],
[/google ads|ads|ppc|meta|facebook|instagram ads|campaign/i,()=>"We run Google Ads and Meta campaigns focused on leads and sales. See <a href=\"#s-google-ads\">Google Ads</a> and <a href=\"#s-paid-lead-generation\">Paid Lead Generation</a>. Ad spend is paid directly to the platform."],
[/seo|ranking|rank|google search|search engine/i,()=>"Our <a href=\"#s-seo-services\">SEO services</a> cover keyword research, on-page and technical fixes, local SEO and monthly reports. SEO is gradual and usually shows results over three to six months."],
[/host|domain|email|server|maintenance|backup|ssl/i,()=>"We handle <a href=\"#s-web-hosting\">web hosting</a>, <a href=\"#s-server-solutions\">server solutions</a> and <a href=\"#s-website-maintenance\">website maintenance</a>, including SSL, backups and business email."],
[/website|web site|wordpress|ecommerce|e-commerce|store|shop|landing/i,()=>"We build <a href=\"#s-website-development\">custom websites</a>, <a href=\"#s-wordpress-development\">WordPress sites</a>, <a href=\"#s-ecommerce-development\">online stores</a> and <a href=\"#s-landing-page-development\">landing pages</a>, all mobile-first and fast."],
[/service|offer|what do you do|what can you/i,()=>"We offer: "+SV.map((x,i)=>'<a href="#s-'+SLUG[i]+'">'+x[2]+"</a>").join(", ")+"."],
[/contact|talk|human|person|call|phone|whatsapp|reach|speak/i,()=>"You can reach our team through the "+links()+". Tell us about your project and we will reply soon."],
[/thank/i,()=>"You are welcome! Anything else I can help with?"],
[/^(hi|hello|hey|good (morning|afternoon|evening))\b/i,()=>"Hello! Ask me about our services, pricing or how long a project takes."]];
const say=(h,u)=>{const d=document.createElement("div");d.className="mb "+(u?"u":"b");if(u)d.textContent=h;else d.innerHTML=h;bm.appendChild(d);bm.scrollTop=bm.scrollHeight;return d};
bq.innerHTML=["Services","Pricing","How long does it take?","Free website audit","Talk to a human"].map(x=>`<button type="button">${x}</button>`).join("");
const ask=q=>{q=q.trim();if(!q)return;say(q,1);const t=say('<span class="dots"><i></i><i></i><i></i></span>');setTimeout(()=>{t.remove();const k=BOT.find(b=>b[0].test(q));say(k?k[1]():"I am not sure about that one yet. Our team can answer it directly. Reach us through the "+links()+".")},600)};
const bopen=o=>{$("bot").hidden=!o;document.body.classList.toggle("bo",o);if(o){if(!bm.children.length)say("Hi! I am the SouGo assistant. Ask me about our services, pricing or timelines.");$("bi").focus()}};
$("fch").onclick=()=>bopen(true);$("bx").onclick=()=>bopen(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("bot").hidden)bopen(false)});
bq.addEventListener("click",e=>{const b=e.target.closest("button");if(b)ask(b.textContent)});
bm.addEventListener("click",e=>{if(e.target.closest("a"))bopen(false)});
$("bf").addEventListener("submit",e=>{e.preventDefault();ask($("bi").value);$("bi").value=""});

/* book a call */
const kpick=g=>{const t=document.querySelector("#"+g+' .tile[aria-pressed="true"]');return t?+t.dataset.i:-1};
const ksum=()=>{const d=kpick("bd"),t=kpick("bt");$("ks").innerHTML=d<0||t<0?"Select a day and time.":"<b>"+fd(BDAYS[d])+"</b> at <b>"+SLOTS[t]+"</b> (IST)"};
["bd","bt"].forEach(g=>$(g).addEventListener("click",e=>{const x=e.target.closest(".tile");if(!x)return;qa(".tile",$(g)).forEach(y=>y.setAttribute("aria-pressed",y===x));$("ebk").textContent="";ksum()}));
$("kf").addEventListener("submit",async ev=>{ev.preventDefault();let ok=true;const set=(id,v)=>{$(id).textContent=v;if(v)ok=false};
const d=kpick("bd"),t=kpick("bt");set("ebk",d>=0&&t>=0?"":"Please choose a day and a time.");
set("ekn",$("kn").value.trim()?"":"Enter your name.");set("eke",/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("ke").value.trim())?"":"Enter a valid email address.");
set("ekp",validIndianMobile($("kp").value)?"":"Enter a valid 10-digit Indian mobile number.");set("ekc",$("kc").checked?"":"Please tick to continue.");
if(!ok||$("kh").value)return;
const when=fd(BDAYS[d])+" at "+SLOTS[t]+" (IST)",nm=$("kn").value.trim(),em=$("ke").value.trim(),ph=$("kp").value.trim(),tp=$("kt").value.trim()||"Not specified";
const text="Call booking request\nWhen: "+when+"\nName: "+nm+"\nEmail: "+em+"\nPhone: "+ph+"\nTopic: "+tp;
const show=(h,p,a,ic)=>{$("kdh").textContent=h;$("kdm").textContent=p;$("kda").innerHTML=a;$("kok").style.display=ic?"block":"none";$("kf").hidden=true;$("kdone").hidden=false};
const b=$("kb");b.disabled=true;b.textContent="Sending…";
try{if(!CONFIG.web3key)throw new Error("no key");await web3({subject:"Call booking request: "+when,name:nm,email:em,phone:ph,"requested time":when,topic:tp,message:text});
b.disabled=false;b.textContent="Request this call";$("kf").reset();qa("#bd .tile,#bt .tile").forEach(x=>x.setAttribute("aria-pressed","false"));ksum();
show("Request received","We have your request for "+when+". We will confirm by email or WhatsApp.",'<a class="btn g" href="#home">Back to home</a>',1);toast("Call requested");return}
catch(x){b.disabled=false;b.textContent="Request this call"}
const a=[];if(EMAILS.length)a.push(lnk("Email our team","mailto:"+EMAILS.join(",")+"?subject="+encodeURIComponent("Call booking request: "+when)+"&body="+encodeURIComponent(text)));
WAS.forEach((w,i)=>a.push(lnk("WhatsApp"+(WAS.length>1?" "+(i+1):""),"https://wa.me/"+w+"?text="+encodeURIComponent(text),1)));
a.push('<button class="btn g" id="kcp" type="button">Copy request</button>','<button class="btn g" id="kbk" type="button">Edit details</button>');
show("Almost done","Your request is ready. Send it with any option below and we will confirm your time.",a.join(""),0);
$("kcp").onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>toast("Select and copy manually"))}catch(x){toast("Select and copy manually")}};
$("kbk").onclick=()=>{$("kf").hidden=false;$("kdone").hidden=true}});

/* newsletter */
$("nf").addEventListener("submit",async ev=>{ev.preventDefault();const e=$("ne").value.trim(),m=$("nm");
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){m.textContent="Enter a valid email address.";return}
const b=$("nf").querySelector("button");b.disabled=true;
try{if(!CONFIG.web3key)throw new Error("no key");await web3({subject:"New newsletter signup",name:"Newsletter subscriber",email:e,message:"Please add this email to the newsletter list: "+e});m.textContent="Thank you for subscribing!";$("nf").reset()}
catch(x){m.innerHTML='Almost there. <a href="mailto:'+(EMAILS[0]||"")+"?subject="+encodeURIComponent("Newsletter signup")+"&body="+encodeURIComponent("Please add me to the newsletter: "+e)+'">Confirm by email</a>'}
b.disabled=false});

/* structured data for search engines */
(()=>{const z=document.createElement("script");z.type="application/ld+json";const o={"@context":"https://schema.org","@type":"ProfessionalService",name:"SouGo Digital",description:"Premium websites, SEO, Google Ads, social media marketing and automation.",serviceType:SV.map(x=>x[2])};
if(EMAILS[0])o.email=EMAILS[0];o.foundingDate="2026";o.address={"@type":"PostalAddress",addressLocality:"Bengaluru",addressCountry:"IN"};if(CONFIG.phone)o.telephone="+"+CONFIG.phone;if(SOCK.length)o.sameAs=SOCK.map(k=>CONFIG.social[k]);
z.textContent=JSON.stringify(o);document.head.appendChild(z)})();

/* free guides */
let gi=0;
document.addEventListener("click",e=>{const g=e.target.closest("[data-guide]");if(!g)return;gi=+g.dataset.guide;const x=GUIDES[gi];$("gt").textContent=x[0];$("gd").textContent=x[2];$("gf").hidden=false;$("gc").hidden=true;$("gdlg").showModal()});
$("gx").onclick=$("gx2").onclick=()=>$("gdlg").close();
$("gf").addEventListener("submit",async ev=>{ev.preventDefault();let ok=true;const set=(id,v)=>{$(id).textContent=v;if(v)ok=false};
set("egn",$("gn").value.trim()?"":"Enter your name.");set("ege",/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("ge").value.trim())?"":"Enter a valid email address.");set("egk",$("gk").checked?"":"Please tick to continue.");
if(!ok||$("gh").value)return;const x=GUIDES[gi];
try{if(CONFIG.web3key)await web3({subject:"Guide download: "+x[0],name:$("gn").value.trim(),email:$("ge").value.trim(),message:$("gn").value.trim()+" ("+$("ge").value.trim()+") downloaded the guide: "+x[0]})}catch(z){}
$("gl").innerHTML=x[3].map(t=>'<label class="chk2"><input type="checkbox"><span>'+t+"</span></label>").join("");$("gf").hidden=true;$("gc").hidden=false;$("gf").reset()});
$("gdl").onclick=()=>{try{const x=GUIDES[gi],txt=x[0]+"\nSouGo Digital\n\n"+x[3].map(t=>"[ ] "+t).join("\n")+"\n",u=URL.createObjectURL(new Blob([txt],{type:"text/plain"})),a=document.createElement("a");a.href=u;a.download=x[0].toLowerCase().replace(/[^a-z0-9]+/g,"-")+".txt";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}catch(z){toast("Could not download. Please copy the list instead.")}};

/* Interactive growth estimator and launch checklist */
(()=>{const v=$("gt-visitors"),r=$("gt-rate"),a=$("gt-value");if(!v||!r||!a)return;const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n);const calc=()=>{const visitors=+v.value,rate=+r.value,value=Math.max(0,+a.value||0),leads=Math.round(visitors*rate/100);$("gt-visitors-v").textContent=visitors.toLocaleString("en-IN");$("gt-rate-v").textContent=rate+"%";$("gt-leads").textContent=leads.toLocaleString("en-IN");$("gt-total").textContent=money(leads*value)};[v,r,a].forEach(x=>x.addEventListener("input",calc));calc();const checks=qa(".launch-check"),update=()=>{const done=checks.filter(x=>x.checked).length,pct=done/checks.length*100;$("launch-bar").style.width=pct+"%";$("launch-count").textContent=done+" of "+checks.length+" completed"};checks.forEach(x=>x.addEventListener("change",update));update()})();


window.addEventListener("load",()=>{setTimeout(()=>$("pre").classList.add("out"),650)},{once:true});setTimeout(()=>$("pre").classList.add("out"),1800);
</script>
